name = "bodega"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# routes = [
#   { pattern = "usebodega.fun", custom_domain = true },
#   { pattern = "www.usebodega.fun", custom_domain = true },
# ]

[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = ["/v1/*", "/v1"]

# Create with `npx wrangler d1 create bodega` and paste the database_id here.
[[d1_databases]]
binding = "DB"
database_name = "bodega"
database_id = "REPLACE_WITH_D1_ID"

[vars]
FEE_TO = "HELnQfJ9mtWX4eoyxQaQF1q53yBAjjxAhGLNYFJdMMxi"            # the wallet the fee goes to; its USDC account must already exist
HOUSE_PAY_TO = "HELnQfJ9mtWX4eoyxQaQF1q53yBAjjxAhGLNYFJdMMxi"      # the wallet the house items are paid to
FEE_BPS = "300"        # 3% of the price, taken out of the seller's part
MIN_PRICE = "0.01"     # one payment costs the fee payer about 0.00001 SOL
SAMPLE_PER_IP = "10"
SAMPLE_PER_DAY = "500"
LIST_PER_DAY = "5"
OWN_PAYERS = ""        # the team's own buyer wallets, comma separated, so stats can tell outside calls apart
TOKEN_ADDRESS = ""     # the token mint after launch: a seller holding HOLD_MIN of it pays no fee
HOLD_MIN = "1000000"
# Secrets (not here):
#   npx wrangler secret put FEE_PAYER_KEY  (base58 or JSON secret key of the fee payer; it only needs SOL for network fees)
#   npx wrangler secret put SOL_RPC_URL    (a private mainnet RPC)
#   npx wrangler secret put ADMIN_KEY      (for /v1/admin/hide)
